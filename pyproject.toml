[project]
name = "amadeus"
version = "0.1.0"
description = "Amadeus: MCP server for the ASC MUSICA supercomputer, with the agent runbook (AGENTS.md) built in"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["mcp>=2.3,<3"]

[project.scripts]
amadeus = "amadeus.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amadeus"]
